<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>請假</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22305F; --paper:#F4F6FB; --card:#fff; --lamp:#E8A43A; --lamp-soft:#FCEFD3;
    --slate:#566180; --line:#D6DBE9; --danger:#B3382C; --ok:#2E7D5B; --warn:#8A5A00;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:#1B2238;
    font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .top{background:var(--ink);color:#fff;padding:22px 0 20px}
  .top h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:.02em}
  .top p{margin:6px 0 0;color:#C9D1EC;font-size:14px}
  main{padding-top:16px;padding-bottom:40px}
  h2{font-size:17px;margin:0 0 10px;font-weight:700}
  h3{font-size:15.5px;margin:0 0 6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin-bottom:14px}
  label{display:block;font-weight:600;font-size:15px;margin:16px 0 4px}
  .grid2 label{margin-top:0}
  input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #B8C0D6;border-radius:8px;background:#fff;color:inherit;min-height:46px}
  input[type=checkbox]{width:22px;height:22px;min-height:0;flex:0 0 auto;margin:3px 0 0}
  textarea{min-height:76px;resize:vertical}
  :focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
  .btn{font:inherit;font-weight:700;min-height:48px;padding:0 20px;border-radius:10px;border:0;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff;width:100%;margin-top:18px;font-size:17px}
  .btn.add{background:#fff;color:var(--ink);border:1.5px solid var(--ink);width:100%;margin-top:10px}
  .btn.danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger);width:100%;margin-top:10px}
  .btn.danger.armed{background:var(--danger);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .link{background:none;border:0;font:inherit;color:var(--ink);text-decoration:underline;padding:8px 4px;min-height:40px;cursor:pointer}
  a{color:var(--ink)}
  .muted{color:var(--slate)} .small{font-size:13.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .who{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  #banner{padding:12px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}
  #banner.ok{background:#DDF0E6;color:#1F5C41}
  #banner.error{background:#FBE3DF;color:#8C2A20}
  .rules p{margin:0 0 6px}
  .rules h3{margin:14px 0 6px;color:var(--ink)}
  .rules h3:first-child{margin-top:0}
  .agree{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:16px 0 0}
  .phase{margin-top:12px;padding:10px 12px;border-radius:8px;background:#EEF1F8;font-weight:600}
  .phase.ok{background:#DDF0E6;color:#1F5C41}
  .phase.closed{background:#FBE9D0;color:#7A4B00}
  .box{margin-top:18px;padding:12px;border:1.5px dashed #AEB7D1;border-radius:10px}
  .codebox{font-size:34px;font-weight:700;letter-spacing:.2em;text-align:center;padding:12px;border-radius:10px;background:var(--lamp-soft);border:2px solid var(--lamp);font-variant-numeric:tabular-nums}
  .tchips{display:flex;flex-wrap:wrap;gap:8px}
  .tchip{min-height:44px;padding:0 14px;border-radius:99px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:#fff;color:var(--ink);border:1.5px solid #AEB7D1}
  .tchip[aria-pressed="true"]{background:var(--lamp-soft);border:2px solid var(--lamp);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .dchip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:99px;background:var(--lamp-soft);border:1.5px solid var(--lamp);color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
  .strip{display:flex;align-items:stretch;margin:6px 0 6px}
  .gap{flex:0 0 2px;margin:0 4px;background:repeating-linear-gradient(to bottom,#AEB7D1 0 4px,transparent 4px 8px)}
  .slot{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:104px;padding:12px 6px;border:2px solid var(--ink);border-radius:6px;background:var(--ink);color:#fff;text-align:center;font:inherit;cursor:pointer}
  .s-name{font-weight:700;font-size:16px}
  .s-time{font-size:12.5px;font-variant-numeric:tabular-nums}
  .s-state{font-size:15px;font-weight:700;border-top:1px solid rgba(255,255,255,.35);padding-top:6px}
  .slot[aria-pressed="true"]{background:repeating-linear-gradient(135deg,var(--lamp-soft) 0 7px,#F6D58F 7px 14px);border-color:var(--lamp);color:var(--ink)}
  .slot[aria-pressed="true"] .s-state{border-top-color:rgba(34,48,95,.35)}
  .summary{margin:14px 0 0;padding:10px 12px;border-left:4px solid var(--lamp);background:var(--lamp-soft);border-radius:0 8px 8px 0;font-weight:600}
  .seg{display:flex;gap:8px}
  .seg button{flex:1 1 0;min-width:0;min-height:62px;padding:8px 4px;border-radius:8px;font:inherit;cursor:pointer;background:#fff;color:var(--ink);border:2px solid var(--ink);display:flex;flex-direction:column;justify-content:center;gap:2px}
  .seg .n{font-weight:700;font-size:16px} .seg .t{font-size:12px;font-variant-numeric:tabular-nums}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{flex:1 1 0;min-height:46px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);border:1.5px solid #AEB7D1}
  .tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  #preview{margin-top:8px}
  .pv{padding:8px 10px;border-radius:8px;margin-top:6px;background:#EEF1F8;font-weight:600}
  .pv .note{display:block;font-weight:400;font-size:13.5px;margin-top:2px;color:var(--warn)}
  .pv.bad{background:#FBE3DF;color:#8C2A20}
  .pv.hot{background:#FBE3DF}
  .row{padding:12px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0;padding-top:0}
  .row .a{font-weight:700} .row .b{font-size:14px;color:var(--slate)}
  .row.off .a,.row.off .b{text-decoration:line-through}
  .row .st{font-size:13.5px;margin-top:2px} .row .st.good{color:var(--ok)} .row .st.bad{color:var(--danger)}
  .rowtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .chip{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:#DDF0E6;color:var(--ok);margin-left:6px;vertical-align:1px;text-decoration:none}
  .chip.off{background:#E8EAF1;color:var(--slate)}
  .chip.hot{background:#FBE3DF;color:var(--danger)}
  .undo,.cancel{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:8px;font:inherit;font-weight:700;font-size:14px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);cursor:pointer}
  .undo.armed,.cancel.armed{background:var(--danger);border-color:var(--danger);color:#fff}
  details{margin-top:6px} summary{cursor:pointer;color:var(--ink);font-weight:600}
  .sub{margin-top:8px;padding-left:10px;border-left:3px solid var(--line);font-size:14px}
  [hidden]{display:none !important}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>請假</h1>
  <p id="sub">家長請假專用</p>
</div></header>

<main class="wrap">
  <div id="banner" hidden></div>

  <section id="loginView" class="card" hidden>
    <h2>請先確認學生身分</h2>
    <p class="muted small" style="margin-top:-4px">請輸入報名時的班級、座號、姓名,以及報名時取得的驗證碼。</p>
    <form id="loginForm" autocomplete="off" novalidate>
      <div class="grid2">
        <div><label for="cls">班級</label><input id="cls" type="text" autocomplete="off" placeholder="例如 901"></div>
        <div><label for="seat">座號</label><input id="seat" type="text" inputmode="numeric" autocomplete="off"></div>
      </div>
      <label for="name">學生姓名</label>
      <input id="name" type="text" autocomplete="off">
      <label for="code">驗證碼</label>
      <input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="6 位數字">
      <button class="btn primary" id="loginBtn" type="submit">進入請假</button>
    </form>
    <button class="link" id="resendBtn" type="button">忘記驗證碼?寄到報名信箱</button>
    <p class="muted small" style="margin:6px 0 0">還沒報名?請到 <a href="../">報名頁面</a>。</p>
  </section>

  <section id="mainView" hidden>
    <div class="who">
      <div><strong id="who"></strong> 家長您好</div>
      <button class="link" id="logout" type="button">登出</button>
    </div>
    <div class="phase closed" style="margin:0 0 10px">請由<strong>家長親自</strong>請假(請勿讓同學自行填寫)。請假不予退費。</div>
    <p class="muted small" id="daysInfo" style="margin:0 0 10px"></p>

    <div class="card">
      <h2>請假日期</h2>
      <div class="grid2">
        <div><label for="dateFrom">從</label><select id="dateFrom"></select></div>
        <div><label for="dateTo">到(連續請假才選)</label><select id="dateTo"></select></div>
      </div>
      <button class="btn add" id="addDates" type="button">加入日期</button>
      <div class="chips" id="chips" aria-live="polite"></div>
      <p class="muted small" id="dateHint" style="margin:10px 0 0"></p>
      <p id="noDates" class="muted small" hidden>目前沒有可以線上請假的日期(只能請你報名的那幾天,暫停自習的日子也不能請),請直接聯絡老師。</p>

      <h2 style="margin-top:22px">請假節次</h2>
      <p class="muted small" id="stripHint" style="margin:0">請先加入日期,再選擇請假節次。平日與週六請分開送出。</p>
      <div class="strip" id="strip" role="group" aria-label="請假節次" hidden></div>
      <div class="tools" id="stripTools" hidden>
        <button class="link" id="allBtn" type="button">整晚請假</button>
        <button class="link" id="clearBtn" type="button">全部取消</button>
      </div>

      <label for="reason">事由</label>
      <select id="reason"></select>
      <label for="note">備註說明(選填)</label>
      <textarea id="note" placeholder="需要讓老師知道的事,不必寫病情細節"></textarea>

      <p class="summary" id="summary" aria-live="polite"></p>
      <button class="btn primary" id="submitBtn" type="button">送出請假</button>
      <p class="muted small" id="cutoffNote" style="margin:12px 0 0"></p>
    </div>

    <div class="card">
      <h2>我的請假紀錄</h2>
      <div id="records"></div>
    </div>
  </section>
</main>

<script>
(function () {
  // ★★ 把下面這行換成 Apps Script「管理部署作業」裡的網頁應用程式網址(結尾是 /exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycby2Q53ln-voTvXCBqj7AtTp-8I5k8BQjUiy3n5wjUnrHseWH02y0fInAJxRE2qxhsWl/exec';

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  // 用 text/plain 送出,瀏覽器就不會多送一次預檢請求(Apps Script 不支援預檢)
  function post(body) {
    if (!API_URL || API_URL.indexOf('/exec') < 0) return Promise.reject(new Error('尚未設定 API_URL'));
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function showBanner(kind, msg) {
    var b = $('banner'); b.className = kind; b.textContent = msg; b.hidden = false;
    b.setAttribute('role', kind === 'error' ? 'alert' : 'status'); b.scrollIntoView({ block: 'nearest' });
  }
  function clearBanner() { $('banner').hidden = true; }
  function setBusy(on) { Array.prototype.forEach.call(document.querySelectorAll('.btn.primary'), function (b) { b.disabled = on; }); }
  function run(body, ok) {
    setBusy(true);
    post(body).then(function (res) { setBusy(false); ok(res); })
      .catch(function (e) { setBusy(false); showBanner('error', '系統暫時無法使用,請稍後再試。'); console.error(e); });
  }
  // 兩段式確認按鈕:第一次按變紅,4 秒內再按一次才執行
  function twoStep(btn, label, armedLabel, fn) {
    btn.addEventListener('click', function () {
      if (!btn.dataset.armed) {
        btn.dataset.armed = '1'; btn.textContent = armedLabel; btn.classList.add('armed');
        setTimeout(function () { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = label; btn.classList.remove('armed'); } }, 4000);
        return;
      }
      delete btn.dataset.armed; btn.textContent = label; btn.classList.remove('armed'); fn();
    });
  }

  var auth = null, L = null, picked = [], openDates = [], sel = {};

  function show(v) { $('loginView').hidden = v !== 'login'; $('mainView').hidden = v !== 'main'; window.scrollTo(0, 0); }

  post({ action: 'info' }).then(function (r) { if (r.ok) { $('sub').textContent = r.name + ' 家長請假'; document.title = '請假'; } show('login'); })
    .catch(function (e) { show('login'); showBanner('error', '系統暫時無法使用,請稍後再試。'); console.error(e); });

  function ident() { return { cls: $('cls').value.trim(), seat: $('seat').value.trim(), name: $('name').value.trim(), code: $('code').value.trim() }; }

  $('resendBtn').addEventListener('click', function () {
    clearBanner();
    var a = ident();
    if (!a.cls || !a.seat || !a.name) { showBanner('error', '請先填班級、座號、姓名。'); return; }
    run({ action: 'signup_resend', cls: a.cls, seat: a.seat, name: a.name }, function (res) { showBanner(res.ok ? 'ok' : 'error', res.msg); });
  });

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault(); clearBanner();
    var a = ident();
    if (!a.cls || !a.seat || !a.name || !a.code) { showBanner('error', '請填寫班級、座號、姓名和驗證碼。'); return; }
    run({ action: 'leave_login', auth: a }, function (res) {
      if (!res.ok) { showBanner('error', res.msg); return; }
      auth = a; L = res; $('code').value = '';
      $('who').textContent = res.cls + ' ' + res.seat + '號 ' + res.name;
      $('daysInfo').textContent = '報名天數:' + res.daysText + '(只能請這幾天的假)';
      $('note').maxLength = res.noteMax;
      $('dateHint').textContent = '連續請假:「從」選第一天、「到」選最後一天,再按加入日期;不連續的日子可分次加入,一次最多 ' + res.maxDates + ' 天。';
      $('cutoffNote').textContent = '當天請假截止:平日 ' + res.cutoffWeekday + ',週六 ' + res.cutoffSat + '。過了截止時間,請直接聯絡老師。';
      var rs = $('reason'); rs.innerHTML = ''; rs.add(new Option('請選擇事由', '')); res.reasons.forEach(function (x) { rs.add(new Option(x, x)); });
      $('note').value = ''; picked = []; sel = {};
      renderDates(res.dates); renderRecords(res.records); refreshAll(); show('main');
    });
  });

  /* 日期 */
  function fill(selectEl, placeholder, dates) {
    selectEl.innerHTML = ''; selectEl.add(new Option(placeholder, ''));
    var g = null, m = '';
    dates.forEach(function (d) {
      if (d.month !== m) { m = d.month; g = document.createElement('optgroup'); g.label = m; selectEl.appendChild(g); }
      g.appendChild(new Option(d.label + (d.type === 'S' ? '(週六)' : ''), d.date));
    });
  }
  function renderDates(dates) {
    openDates = dates;
    fill($('dateFrom'), '請選擇日期', dates); fill($('dateTo'), '只請這一天', dates);
    var open = dates.map(function (d) { return d.date; });
    picked = picked.filter(function (d) { return open.indexOf(d.date) >= 0; });
    $('noDates').hidden = dates.length > 0;
  }
  function lockedType() { return picked.length ? picked[0].type : ''; }

  function refreshAll() { renderChips(); buildStrip(); updateSummary(); }

  function renderChips() {
    var box = $('chips'); box.innerHTML = '';
    if (!picked.length) { box.appendChild(el('p', 'muted small', '還沒有加入日期。選好日期後,按「加入日期」。')); return; }
    picked.forEach(function (d) {
      var b = el('button', 'dchip', d.label + '  ×'); b.type = 'button'; b.setAttribute('aria-label', '移除 ' + d.label);
      b.addEventListener('click', function () {
        picked = picked.filter(function (x) { return x.date !== d.date; });
        if (!picked.length) sel = {};
        refreshAll();
      });
      box.appendChild(b);
    });
  }

  function addDates() {
    var from = $('dateFrom').value, to = $('dateTo').value;
    if (!from) { showBanner('error', '請先在「從」選一個日期。'); return false; }
    var fromD = openDates.filter(function (d) { return d.date === from; })[0];
    var type = lockedType() || fromD.type;
    if (fromD.type !== type) { showBanner('error', '平日與週六請分開送出,請先送出或移除已加入的日期。'); return false; }
    var list;
    if (!to) list = [fromD];
    else {
      if (to < from) { showBanner('error', '「到」的日期要在「從」之後。'); return false; }
      list = openDates.filter(function (d) { return d.date >= from && d.date <= to && d.type === type; });
    }
    var have = picked.map(function (d) { return d.date; });
    var add = list.filter(function (d) { return have.indexOf(d.date) < 0; });
    if (picked.length + add.length > L.maxDates) { showBanner('error', '一次最多可以請 ' + L.maxDates + ' 天,請分次送出。'); return false; }
    if (!picked.length) sel = {};
    picked = picked.concat(add).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    $('dateFrom').value = ''; $('dateTo').value = '';
    refreshAll();
    return true;
  }
  $('addDates').addEventListener('click', function () { clearBanner(); addDates(); });

  /* 節次(依已加入日期的種類:平日或週六) */
  function buildStrip() {
    var t = lockedType(), box = $('strip'); box.innerHTML = '';
    box.hidden = !t; $('stripTools').hidden = !t; $('stripHint').hidden = !!t;
    if (!t) return;
    $('allBtn').textContent = t === 'S' ? '整天請假' : '整晚請假';
    L.sessions[t].forEach(function (s, i) {
      if (i > 0) { var g = el('span', 'gap'); g.setAttribute('aria-hidden', 'true'); box.appendChild(g); }
      var b = el('button', 'slot'); b.type = 'button'; b.dataset.id = s.id;
      b.appendChild(el('span', 's-name', s.label)); b.appendChild(el('span', 's-time', s.time || ' ')); b.appendChild(el('span', 's-state', ''));
      b.addEventListener('click', function () { sel[s.id] = !sel[s.id]; refreshStrip(); });
      box.appendChild(b);
    });
    refreshStrip();
  }
  function refreshStrip() {
    Array.prototype.forEach.call($('strip').querySelectorAll('.slot'), function (b) {
      var on = !!sel[b.dataset.id]; b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.children[2].textContent = on ? '請假' : '到校';
    });
    updateSummary();
  }
  function chosen() { var t = lockedType(); return t ? L.sessions[t].filter(function (s) { return sel[s.id]; }) : []; }
  function sessionText() {
    var t = lockedType(), c = chosen();
    if (!t || !c.length) return '';
    return c.length === L.sessions[t].length ? (t === 'S' ? '整天' : '整晚') : c.map(function (s) { return s.label; }).join('、');
  }
  function datesText() {
    var l = picked.map(function (d) { return d.label; });
    if (!l.length) return '';
    return l.length <= 3 ? l.join('、') : l[0] + '~' + l[l.length - 1] + ' 等 ' + l.length + ' 天';
  }
  function updateSummary() {
    var d = datesText(), s = sessionText();
    $('summary').textContent = (d && s) ? d + ' ' + s + '請假' : '選好日期與節次後,這裡會顯示請假內容。';
  }
  $('allBtn').addEventListener('click', function () { var t = lockedType(); if (t) { L.sessions[t].forEach(function (s) { sel[s.id] = true; }); refreshStrip(); } });
  $('clearBtn').addEventListener('click', function () { sel = {}; refreshStrip(); });

  /* 紀錄 */
  function renderRecords(list) {
    var box = $('records'); box.innerHTML = '';
    if (!list.length) { box.appendChild(el('p', 'muted', '還沒有請假紀錄。')); box.lastChild.style.margin = '0'; return; }
    list.forEach(function (r) {
      var off = r.status !== '有效', row = el('div', 'row' + (off ? ' off' : '')), top = el('div', 'rowtop'), left = el('div');
      var a = el('div', 'a', r.label + ' ' + r.sessions); a.appendChild(el('span', 'chip' + (off ? ' off' : ''), r.status));
      left.appendChild(a); left.appendChild(el('div', 'b', r.reason)); top.appendChild(left);
      if (r.canCancel) {
        var btn = el('button', 'cancel', '撤銷'); btn.type = 'button';
        twoStep(btn, '撤銷', '確定撤銷?', function () {
          clearBanner();
          run({ action: 'leave_cancel', auth: auth, id: r.id }, function (res) {
            if (!res.ok) { showBanner('error', res.msg); return; }
            showBanner('ok', '已撤銷 ' + r.label + ' ' + r.sessions + ' 的請假。'); renderDates(res.dates); renderRecords(res.records); refreshAll();
          });
        });
        top.appendChild(btn);
      }
      row.appendChild(top); box.appendChild(row);
    });
  }

  /* 送出 */
  $('submitBtn').addEventListener('click', function () {
    clearBanner();
    if ($('dateFrom').value && !addDates()) return;     // 選了日期忘記按「加入日期」時自動加入
    var st = chosen();
    if (!picked.length) { showBanner('error', '請先選擇請假日期。'); return; }
    if (!st.length) { showBanner('error', '請至少選擇一個請假節次。'); return; }
    if (!$('reason').value) { showBanner('error', '請選擇事由。'); return; }
    run({ action: 'leave_submit', auth: auth, payload: { dates: picked.map(function (d) { return d.date; }),
          sessions: st.map(function (s) { return s.id; }), reason: $('reason').value, note: $('note').value } }, function (res) {
      if (!res.ok) { showBanner('error', res.msg); return; }
      showBanner('ok', '已送出:' + res.summary + '。');
      picked = []; sel = {}; $('reason').value = ''; $('note').value = '';
      renderDates(res.dates); renderRecords(res.records); refreshAll();
    });
  });

  $('logout').addEventListener('click', function () { auth = null; L = null; picked = []; sel = {}; clearBanner(); show('login'); });

})();
</script>
</body>
</html>
